name: Validate PanScopus
on:
  push:
    branches: [main]
  pull_request:
jobs:
  offline-checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify Python syntax
        run: python -m compileall -q app.py csv_import.py scopus_backend.py
      - name: Verify Chrome Companion JavaScript syntax
        run: |
          node --check chrome_companion/background.js
          node --check chrome_companion/query_reader.js
          node --check chrome_companion/panscopus_content.js
          node --check chrome_companion/popup.js
          node --check chrome_companion/runner.js
      - name: Test Streamlit query detection
        run: node tests/test_query_reader.js
      - name: Run offline checks
        run: python -m unittest discover -s tests -v
